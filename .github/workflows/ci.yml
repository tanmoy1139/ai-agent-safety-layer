name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: |
          python -m pytest tests/ -q

      - name: Check for secrets
        run: |
          # Fail if common secret patterns appear in the codebase
          ! grep -rn -i -E "sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[0-9A-Z]{16}" \
            --include="*.py" --include="*.md" --include="*.toml" --include="*.yaml" \
            src/ tests/ docs/ || (echo "Possible secret found" && exit 1)
